<title>GFC Session Drills</title>
<style>
/* VOICE: pitchside broadcast graphic, firm and readable in one glance on a phone

:root{color-scheme:dark;--bg:#15181C;--panel:#1D2126;--line:#2C3239;--ink:#EEF2F4;--mut:#9AA4AE;--teal:#00E0C6;--red:#FF4D5A;--yel:#FFC53D;--sb:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Calibri,"Helvetica Neue",Helvetica,Arial,sans-serif;overflow-x:clip;padding-bottom:calc(132px + var(--sb))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:rgba(21,24,28,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home{color:var(--mut);text-decoration:none;font-weight:700;font-size:15px;min-height:44px;display:flex;align-items:center;padding-right:4px}.home:hover{color:var(--teal)}.brand{font-weight:800;font-size:17px;flex:1 1 auto}.brand b{color:var(--teal)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex:1 1 300px;max-width:420px}
.seg button{flex:1;min-height:40px;padding:0 8px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:15px;color:var(--mut);white-space:nowrap}
.pills{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}.pills button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:15px;color:var(--mut)}.pills button[aria-selected=true]{border-color:var(--teal);color:var(--teal);background:rgba(0,224,198,.1)}
.seg button[aria-selected=true]{background:var(--teal);color:#0B1014}
main{max-width:1180px;margin:0 auto;padding:14px max(12px,env(safe-area-inset-left)) 0}
.grid{display:grid;gap:16px}
.pitchbox{position:relative;background:#0F1513;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);touch-action:pan-y}
.pitchbox svg{display:block;width:100%;height:auto}
.call{position:absolute;left:10px;top:10px;font-size:clamp(18px,5.4vw,32px);font-weight:900;line-height:1;padding:8px 12px;border-radius:9px;background:var(--teal);color:#0B1014;box-shadow:0 6px 16px rgba(0,0,0,.4);pointer-events:none}
.call.bad{background:var(--red);color:#fff}.call:empty{display:none}
.cnt{position:absolute;right:10px;top:10px;font-size:13px;font-weight:800;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:999px;pointer-events:none}
.hint{color:#6E7781}
.phase h2{margin:2px 0 4px;font-size:clamp(21px,5.6vw,28px);line-height:1.15}
.phase p{margin:0;color:#D6DCE1;font-size:17px}
.tag{display:inline-block;font-size:13px;font-weight:800;color:var(--mut);margin-bottom:2px}
.tag.good{color:var(--teal)}.tag.bad{color:var(--red)}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:10px}
summary{list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;font-size:17px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--teal);font-size:24px;font-weight:400}
details[open] summary::after{content:"–"}
.dc{padding:0 16px 16px}.dc ul,.dc ol{margin:0;padding-left:20px}.dc li{margin:5px 0}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px}dt{color:var(--mut)}dd{margin:0}

.plist button .d{width:10px;height:10px;border-radius:50%;background:#3A424B;flex:none}
.plist button.good .d{background:var(--teal)}.plist button.bad .d{background:var(--red)}
.plist button.act{background:#262B31;color:var(--ink);font-weight:700}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--mut);margin-top:12px}
.key span{display:flex;align-items:center;gap:6px}.key i{width:13px;height:13px;border-radius:50%}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions button{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--teal);background:transparent;color:var(--teal);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(21,24,28,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(10px + var(--sb)) max(12px,env(safe-area-inset-left))}
.bar .in{max-width:640px;margin:0 auto}
.prog{display:flex;gap:4px;height:28px;align-items:center}
.prog button{flex:1;height:28px;border:0;background:transparent;padding:0;display:flex;align-items:center}
.prog button span{display:block;width:100%;height:5px;border-radius:3px;background:#343A41;overflow:hidden}
.prog button span i{display:block;height:100%;width:0;background:var(--teal)}
.prog button.bad span i{background:var(--red)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr;gap:8px;margin-top:6px}
.ctrl button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:#262B31;font-weight:800;font-size:16px}
.ctrl #play{background:var(--teal);color:#0B1014;border-color:var(--teal)}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}.hint{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<body>
<header class="top"><div class="in">
  <div class="brand"><b>GFC</b> Session drills</div>
  <div class="seg" id="grp" role="tablist"><button role="tab" data-g="def">Defending</button><button role="tab" data-g="fin">Finishing</button></div>
  <div class="pills" id="pills" role="tablist"></div>
</div></header>

<main>
<div class="grid">
  <section>
    <div class="pitchbox" id="pbox">
      <svg id="pitch" viewBox="0 0 856 670" role="img" aria-label="Animated drill diagram"></svg>
      <div class="call" id="call"></div>
      <div class="cnt" id="cnt"></div>
      
    </div>
    <div class="phase" aria-live="polite" style="margin-top:14px">
      <span class="tag" id="tag"></span>
      <h2 id="pname"></h2>
      <p id="ptxt"></p>
    </div>
    <div class="key" id="key"></div>
  </section>
  <section id="info"></section>
</div>
<div class="actions">
  <button id="copy">Copy coaching points</button>
  <button id="wake">Keep screen on</button>
</div>
</main>

<nav class="bar" aria-label="Replay controls"><div class="in">
  <div class="prog" id="prog"></div>
  <div class="ctrl">
    <button id="prev" aria-label="Previous phase">◀</button>
    <button id="play">Pause</button>
    <button id="next" aria-label="Next phase">▶</button>
    <button id="spd">1×</button>
  </div>
</div></nav>

  if(playing){const ph=D[cur].phases[idx];if(t<1)t=Math.min(1,t+dt*speed/(ph.dur||2800));else{hold+=dt*speed;if(hold>1700)go(idx+1);}}
  draw();requestAnimationFrame(tick);}
sizeZ();fromHash();requestAnimationFrame(tick);
}
