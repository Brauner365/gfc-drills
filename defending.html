const W='stroke="rgba(255,255,255,.55)" stroke-width="2" fill="none"';
const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
pitch.innerHTML=`<defs>${mk('m-run','#fff')}${mk('m-grun','#00E0C6')}${mk('m-pass','#FFC53D')}${mk('m-shot','#FF4D5A')}<radialGradient id="vig" cx="50%" cy="40%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".45"/></radialGradient></defs>
${stripes}<rect width="856" height="670" fill="url(#vig)"/>
<g ${W}><rect x="20" y="20" width="816" height="630"/><rect x="186" y="20" width="484" height="198"/><rect x="318" y="20" width="220" height="66"/>
<path d="M346 218A110 110 0 0 0 510 218"/><path d="M318 650A110 110 0 0 1 538 650"/><path d="M20 32A12 12 0 0 0 32 20M824 20A12 12 0 0 0 836 32"/></g>
<rect x="384" y="6" width="88" height="14" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.7)" stroke-width="2"/>
<circle cx="428" cy="152" r="3" fill="rgba(255,255,255,.6)"/><circle cx="428" cy="650" r="4" fill="rgba(255,255,255,.6)"/>
<g id="st"></g><g id="dyn"></g>`;
const st=document.getElementById('st'),dyn=document.getElementById('dyn');
const FILL={gfc:['#00E0C6','#0B1014'],gk:['#3EA8FF','#0B1014'],opp:['#EDEFF2','#15181C'],srv:['#FFC53D','#15181C']};
const LC={red:'#FF4D5A',teal:'#00E0C6',yel:'#FFC53D'};
const clone=o=>JSON.parse(JSON.stringify(o));
const ease=k=>k<.5?2*k*k:1-((-2*k+2)**2)/2;
const cl=v=>Math.max(0,Math.min(1,v));
const $=id=>document.getElementById(id);
let cur='oc',S=[],idx=0,t=0,hold=0,playing=!RM,speed=1,last=0,Z=1;
const sizeZ=()=>{const w=pitch.clientWidth||856;Z=Math.max(1,Math.min(1.9,(856/w)*.62));};
const ro=new ResizeObserver(sizeZ);ro.observe(pitch);
function build(d){let prev={pos:clone(d.init),ball:d.ball.slice()};
  S=d.phases.map(ph=>{const end=ph.reset?{pos:clone(d.init),ball:d.ball.slice()}:clone(prev);
    for(const k in ph.pos||{}){const v=ph.pos[k],b=end.pos[k];end.pos[k]=[v[0],v[1],v[2]??b[2]];}
    if(ph.ball)end.ball=[ph.ball[0],ph.ball[1]];
    const s={start:clone(prev),end};prev=end;return s;});}
const lerpA=(a,b,k)=>a+(((b-a+540)%360)-180)*k;
function arrow(a){const [x1,y1,x2,y2,k]=a,col={run:'#fff',grun:'#00E0C6',pass:'#FFC53D',shot:'#FF4D5A'}[k];
  let d=`M${x1} ${y1}L${x2} ${y2}`;
  if(k==='pass'){const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;d=`M${x1} ${y1}Q${mx-dy/len*60} ${my+dx/len*60} ${x2} ${y2}`;}
  return `<path d="${d}" stroke="${col}" stroke-width="${(k==='shot'?3.5:2.6)*Z}" fill="none" ${k.includes('run')?`stroke-dasharray="${8*Z} ${7*Z}"`:''} marker-end="url(#m-${k})" stroke-linecap="round"/>`;}
function token(x,y,f,type,n){const [bg,fg]=FILL[type],r=17*Z,a=f*Math.PI/180,p=(rad,ang)=>`${(x+Math.cos(ang)*rad).toFixed(1)},${(y+Math.sin(ang)*rad).toFixed(1)}`;
  return `<ellipse cx="${x+3*Z}" cy="${y+6*Z}" rx="${r}" ry="${r*.7}" fill="rgba(0,0,0,.38)"/>
  <polygon points="${p(r-3,a-.5)} ${p(r+9*Z,a)} ${p(r-3,a+.5)}" fill="${bg}"/>
  <circle cx="${x}" cy="${y}" r="${r}" fill="${bg}" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>
  <circle cx="${x-5*Z}" cy="${y-6*Z}" r="${r*.45}" fill="rgba(255,255,255,.22)"/>
  <text x="${x}" y="${y+5*Z}" text-anchor="middle" font-size="${(n.length>1?13:15)*Z}" font-weight="800" fill="${fg}">${n}</text>`;}
function draw(){const d=D[cur],ph=d.phases[idx],{start,end}=S[idx];let h='';
  if(ph.arrows)h+=`<g opacity="${cl(t*4)*.9}">${ph.arrows.map(arrow).join('')}</g>`;
  const P={};
  for(const id in d.ents){const s=start.pos[id],e=end.pos[id],dl=(ph.pos&&ph.pos[id]&&ph.pos[id][3])||0,k=ease(cl((t-dl)/(1-dl||1)));
    P[id]=[s[0]+(e[0]-s[0])*k,s[1]+(e[1]-s[1])*k,lerpA(s[2],e[2],k)];}
  if(d.line){const pts=d.line.map(i=>P[i]).sort((a,b)=>a[0]-b[0]),ly=Math.min(...pts.map(p=>p[1]));
    h+=`<line x1="20" y1="${ly}" x2="836" y2="${ly}" stroke="#00E0C6" stroke-width="${2*Z}" stroke-dasharray="${4*Z} ${8*Z}" opacity=".75"/>
    <text x="30" y="${ly-8*Z}" fill="#00E0C6" font-size="${14*Z}" font-weight="800">Line</text>
    <polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#00E0C6" stroke-width="${3*Z}" opacity=".35"/>`;}
  const ms=(ph.marks||[]).filter(m=>t>=(m.at??.6));
  for(const m of ms){if(m.k==='ring')for(const id of m.ids)h+=`<circle cx="${P[id][0]}" cy="${P[id][1]}" r="${25*Z}" fill="none" stroke="#FF4D5A" stroke-width="${3*Z}"/>`;
    if(m.k==='halo')h+=`<circle cx="${P[m.id][0]}" cy="${P[m.id][1]}" r="${(27+Math.sin(performance.now()/180)*3)*Z}" fill="rgba(255,197,61,.14)" stroke="#FFC53D" stroke-width="${2*Z}"/>`;}
  for(const id of Object.keys(d.ents).sort((a,b)=>P[a][1]-P[b][1])){const [type,n]=d.ents[id];h+=token(P[id][0],P[id][1],P[id][2],type,n);}
  const bd=(ph.ball&&ph.ball[2])||0,bk=ease(cl((t-bd)/(1-bd||1))),bx=start.ball[0]+(end.ball[0]-start.ball[0])*bk,by=start.ball[1]+(end.ball[1]-start.ball[1])*bk;
  const lift=ph.arrows&&ph.arrows.some(a=>a[4]==='pass')&&bk>0&&bk<1?Math.sin(bk*Math.PI)*14:0;
  h+=`<ellipse cx="${bx+2}" cy="${by+4}" rx="${6*Z}" ry="${4*Z}" fill="rgba(0,0,0,.4)"/><circle cx="${bx}" cy="${by-lift}" r="${(7+lift*.25)*Z}" fill="#fff" stroke="#15181C" stroke-width="1.5"/>`;
  for(const m of ms)if(m.k==='lab'){const fs=15*Z,w=m.s.length*fs*.56+20*Z,hh=30*Z,x=Math.min(Math.max(m.x-w/2,24),832-w),y=Math.min(Math.max(m.y,hh),640);
    h+=`<rect x="${x}" y="${y-hh*.62}" width="${w}" height="${hh}" rx="${6*Z}" fill="${LC[m.c]}"/><text x="${x+w/2}" y="${y+fs*.3}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${m.c==='red'?'#fff':'#0B1014'}">${m.s}</text>`;}
  dyn.innerHTML=h;
  const segs=$('prog').querySelectorAll('i');segs.forEach((s,i)=>s.style.width=(i<idx?100:i===idx?t*100:0)+'%');}
function panel(){const d=D[cur],ph=d.phases[idx];
  $('cnt').textContent=`${idx+1} / ${d.phases.length}`;
  const c=$('call');c.textContent=ph.call;c.className='call '+ph.tone;
  const tg=$('tag');tg.textContent=ph.tone==='good'?'Right way':ph.tone==='bad'?'Wrong way':'Set up';tg.className='tag '+ph.tone;
  $('pname').textContent=ph.n;$('ptxt').textContent=ph.txt;
  document.querySelectorAll('.plist button').forEach((b,i)=>b.classList.toggle('act',i===idx));}
function go(i){const n=D[cur].phases.length;idx=(i+n)%n;t=RM?1:0;hold=0;panel();draw();}
function setDrill(k){cur=k;const d=D[k];build(d);st.innerHTML=d.statics||'';
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.d===k));
  $('prog').innerHTML=d.phases.map((p,i)=>`<button class="${p.tone}" data-i="${i}" aria-label="Phase ${i+1}: ${p.n}"><span><i></i></span></button>`).join('');
  const I=d.info,li=a=>a.map(x=>`<li>${x}</li>`).join('');
  $('info').innerHTML=`<details open><summary>Phases</summary><div class="dc"><ol class="plist">${d.phases.map((p,i)=>`<li><button class="${p.tone}" data-i="${i}"><span class="d"></span>${i+1}. ${p.n}</button></li>`).join('')}</ol></div></details>
  <details open><summary>Set-up</summary><div class="dc"><dl>${I.setup.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl></div></details>
  <details><summary>How it runs</summary><div class="dc"><ol>${li(I.run)}</ol></div></details>
  <details><summary>Scoring</summary><div class="dc"><ul>${li(I.score)}</ul></div></details>
  <details><summary>Coaching points</summary><div class="dc"><ul>${li(I.points)}</ul></div></details>
  <details><summary>Progressions</summary><div class="dc"><ul>${li(I.prog)}</ul></div></details>`;
  go(0);}
function fromHash(){setDrill(location.hash.slice(1)==='recovery-race'?'rr':'oc');}
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)location.hash=D[b.dataset.d].hash;});
addEventListener('hashchange',fromHash);
const jump=e=>{const b=e.target.closest('button[data-i]');if(b)go(+b.dataset.i);};
$('prog').addEventListener('click',jump);$('info').addEventListener('click',jump);
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
const setPlay=v=>{playing=v;$('play').textContent=v?'Pause':'Play';};
$('play').onclick=()=>{if(!playing&&t>=1)go(idx+1);setPlay(!playing);};
$('spd').onclick=()=>{speed=speed===1?.5:1;$('spd').textContent=speed+'×';};
setPlay(playing);
let sx=null,sy=0;const pb=$('pbox');
pb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
pb.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))go(idx+(dx<0?1:-1));},{passive:true});
pb.addEventListener('click',()=>setPlay(!playing));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);if(e.key===' '&&e.target===document.body){e.preventDefault();setPlay(!playing);}});
$('copy').onclick=async()=>{const d=D[cur],txt=`GFC – ${d.name}\n\nCoaching points:\n`+d.info.points.map(p=>'• '+p).join('\n')+`\n\n${location.href}`;
  try{await navigator.clipboard.writeText(txt);$('copy').textContent='Copied';}catch(e){$('copy').textContent='Copy not allowed here';}
  setTimeout(()=>$('copy').textContent='Copy coaching points',2200);};
let lock=null;
$('wake').onclick=async()=>{try{if(lock){await lock.release();lock=null;$('wake').textContent='Keep screen on';return;}
  lock=await navigator.wakeLock.request('screen');$('wake').textContent='Screen stays on ✓';lock.addEventListener('release',()=>{lock=null;$('wake').textContent='Keep screen on';});}
  catch(e){$('wake').textContent='Not supported on this browser';}};
function tick(ts){const dt=last?Math.min(ts-last,60):0;last=ts;
  if(playing){const ph=D[cur].phases[idx];if(t<1)t=Math.min(1,t+dt*speed/(ph.dur||2800));else{hold+=dt*speed;if(hold>1700)go(idx+1);}}
  draw();requestAnimationFrame(tick);}
sizeZ();fromHash();requestAnimationFrame(tick);
}
</script>
</body>
</html>
